<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Media ID</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="card">

<img src="profile.jpg" class="profile">

<h2 id="name"></h2>

<p id="designation"></p>

<p><b>Reg No :</b> <span id="regno"></span></p>

<p><b>Media House :</b> <span id="media"></span></p>

<p><b>Contact :</b>
<a id="contact"></a>
</p>

<p><b>Email :</b>
<a id="email"></a>
</p>

<div class="buttons">

<a id="youtube" target="_blank">YouTube</a>

<a id="facebook" target="_blank">Facebook</a>

<a id="instagram" target="_blank">Instagram</a>

<a id="whatsapp" target="_blank">WhatsApp</a>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
